name: Державний бот
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
concurrency:
  group: derzhava-bot
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Встановити
        working-directory: bot
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Закрити голосування й виконати закони
        working-directory: bot
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: https://lenartovytschvictor-source.github.io/ukr-derzhava/
        run: node tick.mjs
