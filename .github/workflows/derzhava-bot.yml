name: Державний бот
# GitHub запускає розклад нерегулярно (буває раз на кілька годин),
# тому бот працює «змінами»: один запуск живе ~5,5 години й робить свою роботу
# кожні 15 хвилин, а наприкінці сам запускає наступну зміну.
# Розклад лишається як запасний варіант, якщо ланцюжок колись обірветься.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
concurrency:
  group: derzhava-bot
  cancel-in-progress: false
permissions:
  actions: write
  contents: read
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Встановити
        working-directory: bot
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Зміна бота (кожні 15 хвилин протягом ~5,5 години)
        working-directory: bot
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: https://ukr-derzhava.in.ua/
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          TELEGRAM_REMIND_THREAD_ID: ${{ secrets.TELEGRAM_REMIND_THREAD_ID }}
        run: |
          end=$(( $(date +%s) + 5*3600 + 30*60 ))
          while true; do
            start=$(date +%s)
            echo "=== $(TZ=Europe/Kiev date '+%d.%m %H:%M') ==="
            timeout 600 node tick.mjs || echo "Цей запуск не вдався, наступний за 15 хвилин"
            now=$(date +%s)
            if [ $(( now + 900 )) -ge $end ]; then break; fi
            pause=$(( 900 - (now - start) ))
            if [ $pause -gt 0 ]; then sleep $pause; fi
          done
      - name: Запустити наступну зміну
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run derzhava-bot.yml --ref "${{ github.ref_name }}" -R "${{ github.repository }}"
