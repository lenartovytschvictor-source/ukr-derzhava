<style id="page-style">
/* Layout: one column registry; each land is a row — current flag, name + offices, then the flag history strip */
:root{
  --bg:#150d07; --panel:#21160c; --panel2:#2b1d10; --line:#5a3f1f; --gold:#f0b030; --gold-soft:#c99a45;
  --cream:#f6ead0; --muted:#b89a70; --vacant:#e7c76a; --danger:#e0574a; --ok:#7cc66b;
  --f-display:"Lora","Georgia",serif; --f-body:"Golos Text","DejaVu Sans","Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg)}
body{color:var(--cream);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding-inline:20px;padding-block:28px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:2px solid var(--gold);padding-bottom:16px}
header.top h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4.4vw,44px);color:var(--gold);margin:0;text-wrap:balance}
header.top .meta{color:var(--muted);font-size:13px;margin-top:4px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:600 14px var(--f-body);color:var(--cream);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--gold-soft)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:var(--gold);color:#1b1006;border-color:var(--gold)}
button.ghost{background:transparent}
button.small{padding:4px 9px;font-size:12px;border-radius:6px}
button.danger{color:var(--danger);border-color:#6a2a22;background:transparent}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--danger)}
section.sec{margin-top:28px;scroll-margin-top:70px}
section.sec>h2{font-family:var(--f-display);font-size:28px;color:var(--gold);margin:0 0 4px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
section.sec>h2 small{font:500 14px var(--f-body);color:var(--muted)}
.lands{display:grid;gap:12px;margin-top:16px}
.land{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.flagbox{position:relative}
.flagbox img{width:150px;aspect-ratio:3/2;object-fit:cover;border-radius:6px;display:block;box-shadow:0 2px 0 rgba(0,0,0,.5)}
.info{min-width:0;display:grid;gap:10px;align-content:start}
.name{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.2}
.posts{display:flex;flex-wrap:wrap;gap:8px}
.post{display:flex;flex-direction:column;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:6px 12px;min-width:0}
.post .t{font-size:12px;color:var(--muted);letter-spacing:.02em}
.post .h{font-weight:700}
.post.vac{border-left-color:var(--vacant);border-style:dashed}
.post.vac .h{color:var(--vacant);font-weight:600}
.hist{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.hist .step{display:flex;align-items:center;gap:6px}
.hist img{width:54px;aspect-ratio:3/2;object-fit:cover;border-radius:3px;opacity:.85}
.hist .arrow{color:var(--gold-soft)}
.hist .cur{color:var(--cream)}
/* edit mode */
.edit .name-input{font:700 20px var(--f-display)}
input[type=text]{font:15px var(--f-body);color:var(--cream);background:#120b05;border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
.erow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center}
.fver{display:grid;grid-template-columns:60px minmax(0,1fr) 110px auto;gap:6px;align-items:center}
.fver img{width:60px;aspect-ratio:3/2;object-fit:cover;border-radius:3px}
.elabel{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.landtools{display:flex;gap:6px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:12px}
nav.toc{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;flex-wrap:wrap;padding-block:10px;border-bottom:1px solid var(--line)}
nav.toc button{font-size:14px;padding:7px 14px;border-radius:999px;background:var(--panel)}

.econ{display:grid;gap:22px;margin-top:16px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table.bud{border-collapse:collapse;width:100%;min-width:640px;font-variant-numeric:tabular-nums}

table.bud thead th{background:var(--panel2);font-weight:700}

table.bud tbody tr:last-child td,table.bud tbody tr:last-child th{border-bottom:0}
table.bud tfoot td,table.bud tfoot th{background:var(--panel2);font-size:13px;color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;border-radius:999px;padding:3px 11px;border:1px solid transparent}
.st.y{background:rgba(124,198,107,.16);color:var(--ok);border-color:rgba(124,198,107,.4)}
.st.n{background:rgba(224,87,74,.14);color:var(--danger);border-color:rgba(224,87,74,.4)}
button.st{cursor:pointer;font:700 13px var(--f-body)}
.vacname{color:var(--vacant)}
.patrons{display:grid;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.patrons h3{margin:0;font-family:var(--f-display);color:var(--gold);font-size:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.patrons h3 small{font:500 14px var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}
.prow{display:grid;grid-template-columns:minmax(80px,160px) minmax(0,1fr) 150px;gap:12px;align-items:center;font-variant-numeric:tabular-nums}
.prow .bar{height:14px;background:var(--panel2);border-radius:999px;overflow:hidden;display:block}
.prow .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-soft),var(--gold));border-radius:999px}
.prow .v{text-align:right;white-space:nowrap}
.prow .v small{color:var(--muted);margin-left:6px}
.erow.pt{grid-template-columns:minmax(0,1fr) 160px auto}
.erow.mem{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto}
.leaders{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.leaders .post{border-left-color:var(--gold);background:linear-gradient(var(--panel2),var(--panel));padding:8px 16px}
.leaders .post .h{font-family:var(--f-display);font-size:19px}
.land.unit{grid-template-columns:110px minmax(0,1fr)}
.land.unit .flagbox img{width:110px;aspect-ratio:auto;max-height:140px;object-fit:contain;box-shadow:none;border-radius:0;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.hist.unit img{aspect-ratio:auto;width:auto;height:44px}
.members{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.members .lbl{color:var(--muted);font-size:12px;margin-right:2px}
.members .m{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.cons{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;margin-top:18px;align-items:start}
.cons aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:grid;gap:4px;font-size:14px}
.cons aside button{text-align:left;background:transparent;border:0;border-left:2px solid var(--line);border-radius:0;padding:5px 10px;font-weight:500;color:var(--muted)}
.cons aside button:hover{color:var(--gold);border-left-color:var(--gold)}
.cons article.doc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:clamp(18px,4vw,40px);max-width:820px}
.doc .pre{font-family:var(--f-display);font-style:italic;font-size:18px;line-height:1.6;border-left:3px solid var(--gold);padding-left:16px;margin:0 0 8px}
.doc h3{font-family:var(--f-display);color:var(--gold);font-size:24px;margin:34px 0 4px;scroll-margin-top:80px;text-wrap:balance}
.doc h4{font-size:17px;margin:20px 0 6px;color:var(--cream)}
.doc p.cl{margin:4px 0;line-height:1.6;max-width:70ch}
.doc p.cl b{color:var(--gold-soft);font-variant-numeric:tabular-nums}
textarea{font:14px/1.5 var(--f-body);color:var(--cream);background:#120b05;border:1px solid var(--line);border-radius:6px;padding:8px;width:100%;min-height:90px;resize:vertical}
.artedit{display:grid;gap:6px;padding:10px;border:1px dashed var(--line);border-radius:8px;margin-top:10px}

.kpi .k{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

.kpi .s{font-size:13px;color:var(--muted)}
.kpi a{color:var(--gold);font-weight:600}
.block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.block h3{margin:0;font-family:var(--f-display);color:var(--gold);font-size:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.block h3 small{font:500 14px var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}
table.exp{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
table.exp th,table.exp td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}

.erow.ex{grid-template-columns:100px minmax(0,1.6fr) 110px 90px minmax(0,1fr) auto}

select{font:15px var(--f-body);color:var(--cream);background:#120b05;border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;width:100%}

function landList(st){const out=[];st.sections.filter(x=>!x.kind&&x.lands).forEach(sec=>sec.lands.forEach(l=>out.push({sec,l,name:(l.flags[l.flags.length-1]||{}).name||''})));return out;}
function findLand(st,name){return landList(st).find(x=>x.name===name)||null;}
const otaNum=q=>{const m=/^(\d+)\s*-?\s*[йя]?\s*Крайов/i.exec(String(q.title||'').trim());return m?+m[1]:0;};
function govSec(st){return (st||state).sections.find(x=>x.kind==='gov');}
function landSecs(st){return (st||state).sections.filter(x=>!x.kind&&x.lands);}
function lostSec(st,create){st=st||state;let s=st.sections.find(x=>x.kind==='lost');if(!s&&create){const i=st.sections.findIndex(x=>x.id==='ck');s={id:'lost',kind:'lost',tab:'ud',nav:'Втрачені',title:'Втрачені Землі',note:'Землі, над якими держава втратила контроль',lands:[]};st.sections.splice(i<0?1:i+1,0,s);}return s;}
function lostList(st){const s=lostSec(st);return s?s.lands.map(l=>({l,name:(l.flags[l.flags.length-1]||{}).name||''})):[];}
function govPost(st,id){const g=govSec(st);return g&&(g.posts||[]).find(x=>x.id===id);}
function hetmanName(st){const p=govPost(st,'hetman');return p&&String(p.name||'').trim()||'';}
function syncArmyHetman(st,name){(st||state).sections.forEach(x=>(x.leaders||[]).forEach(l=>{if(/^гетьман$/i.test(String(l.title||'').trim()))l.holder=name;}));}
// apply a passed law to a state object (the real one when saving, a copy for the preview)
function applyLaw(b,st){const am=b.amend;if(!am||!am.mode||am.mode==='none')return 'none';
  if(CONST_MODES.includes(am.mode)){const cs=st.sections.find(x=>x.kind==='doc');return applyAmend(b,cs&&cs.doc);}
  const parl=st.sections.find(x=>x.kind==='parliament');const gov=govSec(st);
  const fail=()=>{b.applyFailed=true;return 'fail';};const ok=ap=>{b.applied=ap;delete b.applyFailed;return 'ok';};
  if(CODE_MODES.includes(am.mode))return applyCode(b,st,ok,fail);
  if(['ataman','dismiss','rename','flag'].includes(am.mode)){const L=findLand(st,am.land);if(!L||!parl)return fail();const l=L.l;l.posts=l.posts||[];
    if(am.mode==='ataman'||am.mode==='dismiss'){const ota=l.posts.filter(q=>otaNum(q)>0).sort((x,y)=>otaNum(y)-otaNum(x));const top=ota[0];
      const filled=top&&String(top.holder||'').trim()&&top.holder!=='0';let post,added=false,prevHolder='';
      if(am.mode==='ataman'){if(top&&!filled){post=top;prevHolder=top.holder||'';}else{post={title:((top?otaNum(top):0)+1)+'-й Крайовий Отаман',holder:''};l.posts.push(post);added=true;}post.holder=am.name;}
      else{if(!filled)return fail();post={title:(otaNum(top)+1)+'-й Крайовий Отаман',holder:''};l.posts.push(post);added=true;}
      const rE=(parl.repEmails=parl.repEmails||{}),rH=(parl.repHolder=parl.repHolder||{});const prevE=am.land in rE?rE[am.land]:null,prevH=am.land in rH?rH[am.land]:null;
      if(am.mode==='ataman'){if(am.email){rE[am.land]=am.email;rH[am.land]=am.name;}}else{delete rE[am.land];delete rH[am.land];}
      return ok({mode:am.mode,land:am.land,title:post.title,added,prevHolder,prevE,prevH});}
    if(am.mode==='rename'){if(!am.newName)return fail();const cur=l.flags[l.flags.length-1]||{};l.flags.push({img:cur.img||'',name:am.newName,date:today()});
      ['repEmails','repHolder'].forEach(k=>{const m=parl[k];if(m&&am.land in m){m[am.newName]=m[am.land];delete m[am.land];}});
      return ok({mode:'rename',land:am.newName,oldName:am.land});}
    if(am.mode==='flag'){if(!am.img)return fail();const cur=l.flags[l.flags.length-1]||{};l.flags.push({img:am.img,name:cur.name||am.land,date:today()});return ok({mode:'flag',land:am.land});}}
  if(am.mode==='newland'){const sec=landSecs(st).find(x=>x.id===am.sec)||landSecs(st)[0];if(!sec||!am.name)return fail();
    const id='l'+String(b.id||Date.now().toString(36)).slice(-10);if(sec.lands.some(x=>x.id===id))return fail();
    sec.lands.push({id,flags:[{img:am.img||'',name:am.name,date:today()}],posts:[{title:'1-й Крайовий Отаман',holder:am.ataman||''}]});
    if(parl&&am.ataman&&am.email){(parl.repEmails=parl.repEmails||{})[am.name]=am.email;(parl.repHolder=parl.repHolder||{})[am.name]=am.ataman;}
    return ok({mode:'newland',landId:id,sec:sec.id,name:am.name});}
  if(am.mode==='loseland'){const L=findLand(st,am.land);if(!L)return fail();const ls=lostSec(st,true);const i=L.sec.lands.indexOf(L.l);L.sec.lands.splice(i,1);
    L.l.lostFrom=L.sec.id;L.l.lostAt=today();ls.lands.push(L.l);return ok({mode:'loseland',landId:L.l.id,from:L.sec.id,idx:i});}
  if(am.mode==='restoreland'){const ls=lostSec(st);const x=ls&&ls.lands.find(l=>(l.flags[l.flags.length-1]||{}).name===am.land);if(!x)return fail();
    const sec=landSecs(st).find(q=>q.id===x.lostFrom)||landSecs(st)[0];ls.lands.splice(ls.lands.indexOf(x),1);const ap={mode:'restoreland',landId:x.id,from:x.lostFrom,lostAt:x.lostAt,sec:sec.id};
    delete x.lostFrom;delete x.lostAt;x.restoredAt=today();sec.lands.push(x);return ok(ap);}
  if(am.mode==='addplayer'){const ps=plSec(st);if(!ps||!am.name||plByName(am.name,st))return fail();const id='pl'+String(b.id||Date.now().toString(36)).slice(-10);ps.list.push({id,name:am.name,profile:am.profile||'',email:lc(am.email),img:''});return ok({mode:'addplayer',id});}
  if(am.mode==='revokedecree'){if(!am.newsId)return fail();return ok({mode:'revokedecree',newsId:am.newsId});}
  if(am.mode==='editplayer'){const pp=plByName(am.name,st);if(!pp)return fail();if(am.newName&&plByName(am.newName,st))return fail();const ap={mode:'editplayer',name:am.newName||am.name,oldName:am.name,prev:{profile:pp.profile||'',email:pp.email||''}};
    if(am.profile)pp.profile=am.profile;if(am.email)pp.email=lc(am.email);if(am.clearEmail)pp.email='';if(am.newName){renameEverywhere(am.name,am.newName,st);pp.name=am.newName;}return ok(ap);}
  if(am.mode==='delplayer'){const ps=plSec(st);const pp=plByName(am.name,st);if(!ps||!pp)return fail();const i=ps.list.indexOf(pp);ps.list.splice(i,1);return ok({mode:'delplayer',p:pp,i});}
  if(am.mode==='chairfire'){if(!parl||!String(parl.chair||'').trim())return fail();const ap={mode:'chairfire',prev:parl.chair||'',prevE:parl.chairEmail||''};parl.chair='';parl.chairEmail='';return ok(ap);}
  if(am.mode==='govfire'){const p=govPost(st,am.post);if(!p||!String(p.name||'').trim())return fail();const ap={mode:'govfire',post:am.post,prevName:p.name||'',prevEmail:p.email||''};p.name='';p.email='';if(am.post==='hetman')syncArmyHetman(st,'');return ok(ap);}
  if(am.mode==='chair'){if(!parl)return fail();const ap={mode:'chair',prev:parl.chair||'',prevE:parl.chairEmail||''};parl.chair=am.name;parl.chairEmail=am.email||'';return ok(ap);}
  if(am.mode==='holiday'){const cs=calSec(st);if(!cs||!am.name)return fail();cs.holidays=cs.holidays||[];const id='h'+String(b.id||Date.now().toString(36)).slice(-10);if(cs.holidays.some(x=>x.id===id))return fail();
    cs.holidays.push({id,name:am.name,day:+am.day||1,month:+am.month||1,text:am.text||'',since:today(),law:b.title||''});return ok({mode:'holiday',id});}
  if(am.mode==='holidaydel'){const cs=calSec(st);const i=((cs&&cs.holidays)||[]).findIndex(x=>x.id===am.hid);if(i<0)return fail();const x=cs.holidays.splice(i,1)[0];return ok({mode:'holidaydel',h:x,i});}
  if(am.mode==='emergency'||am.mode==='emergencyend')return ok({mode:am.mode});
  if(am.mode==='patriarch'){const c=churchSec(st);if(!c||!am.name)return fail();const ap={mode:'patriarch',prev:c.patriarch||''};c.patriarch=am.name;return ok(ap);}
  if(am.mode==='patriarchfire'){const c=churchSec(st);if(!c||!String(c.patriarch||'').trim())return fail();const ap={mode:'patriarchfire',prev:c.patriarch};c.patriarch='';return ok(ap);}
  if(am.mode==='gov'){const p=gov&&(gov.posts||[]).find(x=>x.id===am.post);if(!p)return fail();const ap={mode:'gov',post:am.post,prevName:p.name||'',prevEmail:p.email||''};p.name=am.name;p.email=am.email||'';if(am.post==='hetman')syncArmyHetman(st,am.name);return ok(ap);}
  if(am.mode==='committee'){if(!parl||!am.name)return fail();parl.committees=parl.committees||[];const id='c'+String(b.id||Date.now().toString(36)).slice(-10);if(parl.committees.some(x=>x.id===id))return fail();parl.committees.push({id,name:am.name,type:am.ctype==='cvk'?'cvk':'other',head:am.head||'',members:am.members||[],law:b.title||'',at:today()});return ok({mode:'committee',id});}
  if(am.mode==='committeedel'){const cs=(parl&&parl.committees)||[];const i=cs.findIndex(x=>x.id===am.cid);if(i<0)return fail();const x=cs.splice(i,1)[0];return ok({mode:'committeedel',c:x,i});}
  if(am.mode==='election')return ok({mode:'election'});
  return 'none';}
function revertLaw(b,st){const ap=b.applied;if(!ap)return false;
  if(CONST_MODES.includes(ap.mode)){const cs=st.sections.find(x=>x.kind==='doc');return revertAmend(b,cs&&cs.doc);}
  const parl=st.sections.find(x=>x.kind==='parliament');const gov=govSec(st);
  if(ap.mode==='ataman'||ap.mode==='dismiss'){const L=findLand(st,ap.land);if(!L)return false;const i=L.l.posts.findIndex(q=>q.title===ap.title);if(i<0)return false;
    if(ap.added)L.l.posts.splice(i,1);else L.l.posts[i].holder=ap.prevHolder;
    const rE=(parl.repEmails=parl.repEmails||{}),rH=(parl.repHolder=parl.repHolder||{});if(ap.prevE==null)delete rE[ap.land];else rE[ap.land]=ap.prevE;if(ap.prevH==null)delete rH[ap.land];else rH[ap.land]=ap.prevH;}
  else if(ap.mode==='rename'){const L=findLand(st,ap.land);if(!L)return false;L.l.flags.pop();['repEmails','repHolder'].forEach(k=>{const m=parl[k];if(m&&ap.land in m){m[ap.oldName]=m[ap.land];delete m[ap.land];}});}
  else if(ap.mode==='flag'){const L=findLand(st,ap.land);if(!L)return false;L.l.flags.pop();}
  else if(ap.mode==='revokedecree'||ap.mode==='emergency'||ap.mode==='emergencyend'){}
  else if(CODE_MODES.includes(ap.mode)){if(!revertCode(ap,st))return false;}
  else if(ap.mode==='patriarch'||ap.mode==='patriarchfire'){const c=churchSec(st);if(!c)return false;c.patriarch=ap.prev;}
  else if(ap.mode==='holiday'){const cs=calSec(st);if(!cs)return false;cs.holidays=(cs.holidays||[]).filter(x=>x.id!==ap.id);}
  else if(ap.mode==='holidaydel'){const cs=calSec(st);if(!cs)return false;cs.holidays=cs.holidays||[];cs.holidays.splice(Math.min(ap.i,cs.holidays.length),0,ap.h);}
  else if(ap.mode==='editplayer'){const pp=plByName(ap.name,st);if(!pp)return false;pp.profile=ap.prev.profile;pp.email=ap.prev.email;if(ap.name!==ap.oldName){renameEverywhere(ap.name,ap.oldName,st);pp.name=ap.oldName;}}
  else if(ap.mode==='delplayer'){const ps=plSec(st);if(!ps||plByName(ap.p.name,st))return false;ps.list.splice(Math.min(ap.i,ps.list.length),0,ap.p);}
  else if(ap.mode==='addplayer'){const ps=plSec(st);if(!ps)return false;ps.list=ps.list.filter(x=>x.id!==ap.id);}
  else if(ap.mode==='chair'||ap.mode==='chairfire'){parl.chair=ap.prev;parl.chairEmail=ap.prevE;}
  else if(ap.mode==='newland'){const sec=landSecs(st).find(x=>x.lands.some(l=>l.id===ap.landId));if(!sec)return false;sec.lands=sec.lands.filter(l=>l.id!==ap.landId);['repEmails','repHolder'].forEach(k=>{if(parl[k])delete parl[k][ap.name];});}
  else if(ap.mode==='loseland'){const ls=lostSec(st);const x=ls&&ls.lands.find(l=>l.id===ap.landId);if(!x)return false;ls.lands.splice(ls.lands.indexOf(x),1);delete x.lostFrom;delete x.lostAt;const sec=landSecs(st).find(q=>q.id===ap.from)||landSecs(st)[0];sec.lands.splice(Math.min(ap.idx,sec.lands.length),0,x);}
  else if(ap.mode==='restoreland'){const sec=landSecs(st).find(q=>q.lands.some(l=>l.id===ap.landId));if(!sec)return false;const x=sec.lands.find(l=>l.id===ap.landId);sec.lands.splice(sec.lands.indexOf(x),1);x.lostFrom=ap.from;x.lostAt=ap.lostAt;delete x.restoredAt;lostSec(st,true).lands.push(x);}
  else if(ap.mode==='gov'||ap.mode==='govfire'){const p=gov&&(gov.posts||[]).find(x=>x.id===ap.post);if(!p)return false;p.name=ap.prevName;p.email=ap.prevEmail;if(ap.post==='hetman')syncArmyHetman(st,ap.prevName);}
  else if(ap.mode==='committee'){if(parl)parl.committees=(parl.committees||[]).filter(x=>x.id!==ap.id);}
  else if(ap.mode==='committeedel'){if(parl){parl.committees=parl.committees||[];parl.committees.splice(Math.min(ap.i,parl.committees.length),0,ap.c);}}
  delete b.applied;return true;}
function amendHtml(b){const am=b.amend;if(!am||!am.mode||am.mode==='none')return '';
  const isC=CONST_MODES.includes(am.mode),isK=CODE_MODES.includes(am.mode);let h=`<div class="amend"><div class="amh">${isC?'📜 Зміна до Конституції':isK?'📕 Зміна до кодексу':'⚖ Що змінює закон'}</div>`;
  if(isK)h+=codeAmendHtml(am);
  if(am.mode==='replace')h+=`<div class="ams">${esc(am.artTitle||'')}</div><div class="diff"><del>${esc(am.find||'')}</del><ins>${am.repl?esc(am.repl):'<i>(текст видаляється)</i>'}</ins></div>`;
  else if(am.mode==='constfull')h+=`<div class="ams">Нова редакція Конституції в цілому</div><div class="lawline">Розділів: <b>${(am.chapters||[]).length}</b> · статей: <b>${(am.chapters||[]).reduce((n,c)=>n+c.articles.length,0)}</b></div><details class="fulld"><summary>Повний текст нової редакції</summary><div class="fullt">${am.preamble?`<p><i>${esc(am.preamble).replace(/\n/g,'<br>')}</i></p>`:''}${(am.chapters||[]).map((c,i)=>`<h4>Розділ ${roman(i+1)}. ${esc(chName(c.title))}</h4>${c.articles.map(a=>`<p><b>${esc(a.title)}</b>${a.body?'<br>'+esc(a.body).replace(/\n/g,'<br>'):''}</p>`).join('')}`).join('')}</div></details>`;
  else if(am.mode==='delart')h+=`<div class="ams">Виключити статтю</div><div class="diff"><del><b>${esc(am.artTitle||'')}</b>${am.body?'\n'+esc(am.body):''}</del></div>`;
  else if(am.mode==='addch')h+=`<div class="ams">Створити новий розділ ${am.pos!=null?'на місці розділу '+roman(+am.pos+1):'в кінці'}${am.shift?'. Номери наступних розділів зсунуться на один.':''}</div><div class="diff"><ins><b>Розділ ${roman((am.pos!=null?+am.pos:0)+1)}. ${esc(am.name||'')}</b></ins></div>`;
  else if(am.mode==='delch')h+=`<div class="ams">Виключити розділ разом з усіма його статтями. Номери наступних розділів зсунуться.</div><div class="diff"><del><b>${esc(am.chTitle||'')}</b>${(am.arts||[]).length?'\n'+am.arts.map(esc).join('\n'):''}</del></div>`;
  else if(am.mode==='add')h+=`<div class="ams">Нова стаття${am.chTitle?' в розділі «'+esc(am.chTitle)+'»':''}</div><div class="diff"><ins><b>${esc(am.title||b.title||'')}</b>\n${esc(am.body||'')}</ins></div>`;
  else if(am.mode==='ataman')h+=`<div class="lawline">👤 Призначити Крайовим Отаманом Землі «${esc(am.land)}»: <b>${plink(am.name)}</b></div>`;
  else if(am.mode==='dismiss')h+=`<div class="lawline">🚪 Звільнити Крайового Отамана Землі «${esc(am.land)}»</div>`;
  else if(am.mode==='rename')h+=`<div class="lawline">✏️ Перейменувати Землю: «${esc(am.land)}» → <b>«${esc(am.newName)}»</b></div>`;
  else if(am.mode==='flag')h+=`<div class="lawline">🏳 Новий прапор Землі «${esc(am.land)}»</div>${am.img?`<img class="lawflag" src="${esc(am.img)}" alt="Новий прапор Землі ${esc(am.land)}">`:''}`;
  else if(am.mode==='chair')h+=`<div class="lawline">🪑 Голова Палати Земель: <b>${plink(am.name)}</b></div>`;
  else if(am.mode==='revokedecree')h+=`<div class="lawline">🚫 Скасувати Указ Гетьмана №${esc(am.no||'')} «${esc(am.title||'')}»</div>`;
  else if(am.mode==='editplayer')h+=`<div class="lawline">✏️ Змінити дані гравця <b>${plink(am.name)}</b>: ${[am.newName?`ім’я → «${esc(am.newName)}»`:'',am.profile?`профіль → ${esc(am.profile)}`:'',am.email?`пошта → ${esc(maskEmail(am.email))}`:'',am.clearEmail?'пошту відв’язати':''].filter(Boolean).join(', ')}</div>`;
  else if(am.mode==='delplayer')h+=`<div class="lawline">🚫 Виключити з реєстру гравців: <b>${esc(am.name)}</b>. Він втратить вхід, голос і посади на сайті.</div>`;
  else if(am.mode==='addplayer'){const u=profUrl(am.profile);h+=`<div class="lawline">👤 Внести до реєстру гравців: <b>${esc(am.name)}</b>${u?` · <a href="${esc(u)}" target="_blank" rel="noopener">профіль у грі ↗</a>`:''}${am.email?` <span class="hint">· вхід: ${esc(maskEmail(am.email))}</span>`:''}</div>`;}
  else if(am.mode==='chairfire')h+=`<div class="lawline">🪑 Звільнити Голову Палати Земель</div>`;
  else if(am.mode==='govfire')h+=`<div class="lawline">🚪 Звільнити з посади: <b>${esc(am.postTitle||'')}</b>${am.who?' ('+esc(am.who)+')':''}</div>`;
  else if(am.mode==='newland')h+=`<div class="lawline">🆕 Утворити нову Землю <b>«${esc(am.name)}»</b>${am.secTitle?' у складі «'+esc(am.secTitle)+'»':''}${am.ataman?` · 1-й Крайовий Отаман: <b>${plink(am.ataman)}</b>`:''}</div>${am.img?`<img class="lawflag" src="${esc(am.img)}" alt="Прапор нової Землі">`:''}`;
  else if(am.mode==='loseland')h+=`<div class="lawline">🏴 Визнати втрату контролю над Землею «${esc(am.land)}». Земля переходить до архіву «Втрачені Землі».</div>`;
  else if(am.mode==='restoreland')h+=`<div class="lawline">🔁 Відновити Землю «${esc(am.land)}» у складі держави</div>`;
  else if(am.mode==='holiday')h+=`<div class="lawline">🎉 Встановити державне свято <b>«${esc(am.name)}»</b> — щороку ${+am.day} ${MONTHS_G[(+am.month||1)-1]}</div>${am.text?`<div class="hint">${esc(am.text)}</div>`:''}`;
  else if(am.mode==='holidaydel')h+=`<div class="lawline">🗓 Скасувати державне свято «${esc(am.name)}» (${+am.day} ${MONTHS_G[(+am.month||1)-1]})</div>`;
  else if(am.mode==='emergency')h+=`<div class="lawline">🚨 Запровадити надзвичайний стан на <b>${+am.days} ${dniv(+am.days)}</b></div><div class="hint">Причина: ${esc(am.reason||'')}</div>`;
  else if(am.mode==='emergencyend')h+=`<div class="lawline">🕊 Припинити надзвичайний стан</div>`;
  else if(am.mode==='patriarch')h+=`<div class="lawline">✝ ${PATR_TITLE}: <b>${plink(am.name)}</b></div>`;
  else if(am.mode==='patriarchfire')h+=`<div class="lawline">✝ Усунути Патріарха${am.who?' ('+esc(am.who)+')':''}</div>`;
  else if(am.mode==='gov')h+=`<div class="lawline">🏛 ${esc(am.postTitle||'Посада')}: <b>${plink(am.name)}</b></div>`;
  if(b.applied)h+=`<div class="amok">✓ ${isK?'Внесено до кодексу':isC?'Внесено до Конституції'+(b.article?' ('+esc(b.article)+')':''):'Закон набрав чинності'}</div>`;
  else if(b.applyFailed)h+=`<div class="amfail">⚠ Автоматично виконати не вдалося${isC?': текст статті вже змінився':''}. Адміністрація зробить це вручну.</div>`;
  return h+'</div>';}
// passed laws are shown in effect immediately, even before an admin opens the site and stores them
let VIEW_CACHE={key:'',st:null};
function viewState(){const pend=allBills().filter(b=>b.amend&&b.amend.mode&&b.amend.mode!=='none'&&!b.applied&&!b.applyFailed&&phase(b)==='passed');const voidNow=((parlSec()||{}).bills||[]).some(x=>x.applied&&x.status==='passed'&&voidedBy(x.id));if(voidNow&&!pend.length)pend.push({id:'__void',amend:{mode:'none'}});
  if(!pend.length)return state;const key=saved.length+'|'+JSON.stringify(state).length+'|'+pend.map(b=>b.id).join(',')+'|'+Object.keys(SIGS).length+'|'+CASES.filter(c=>c.verdict&&c.verdict.voidBill).length;
  if(VIEW_CACHE.key===key)return VIEW_CACHE.st;
  const c=JSON.parse(JSON.stringify(state));(((c.sections.find(x=>x.kind==='parliament')||{}).bills)||[]).forEach(x=>{if(x.applied&&x.status==='passed'&&voidedBy(x.id))revertLaw(x,c);});pend.filter(b=>!voidedBy(b.id)).slice().sort((x,y)=>String(x.closesAt||'').localeCompare(String(y.closesAt||''))).forEach(b=>applyLaw(JSON.parse(JSON.stringify(b)),c));
  VIEW_CACHE={key,st:c};return c;}
// live bills submitted by representatives (Firestore "proposals"), voting 12h from submission
function liveBills(){return PROPS.filter(pr=>pr.at).map(pr=>{const end=pr.at+(+pr.hours||24)*3600000;const conf=+pr.closedAtMs||0;const ec=conf||earlyClose(pr.id,end);const eff=ec&&ec<end?ec:end;return {early:eff<end,earlyOk:!!conf&&conf<end,id:pr.id,live:true,email:pr.email,title:pr.title,text:pr.text,date:pr.date,author:pr.petition?pr.author:(pr.author?pr.author+' ('+pr.land+')':pr.land),amend:pr.amend||null,kind:pr.kind||'',voting:true,status:'review',closesAt:new Date(eff).toISOString(),hours:+pr.hours||24,at0:pr.at};});}
function allBills(){const p=parlSec();const st=(p&&p.bills)||[];const seen=new Set();const out=[];st.forEach(b=>{if(b.id&&seen.has(b.id))return;if(b.id)seen.add(b.id);out.push(b);});return [...liveBills().filter(b=>!seen.has(b.id)),...out];}

 України були звільнені. Українська Держава відновила контроль над усією своєю територією."},{"id":"e6","date":"10 вересня 2026","ic":"🏆","title":"Перемога над Угорщиною","text":"Угорщина зазнала поразки. Українська Держава встановила контроль над усією територією Угорщини та південною частиною Словаччини.\nТого ж дня українські війська зустрілися з військами Білорусі та Дагестану й передали їм лінію фронту.\nТакож цього дня впала промислова столиця альянсу, яка не була готова до оборони через несподівану атаку піратів-терористів."},{"id":"e7","date":"11 вересня 2026","ic":"🗺","title":"Донська Земля","text":"У складі Української Держави було сформовано Донську Землю. До складу Слобідської Землі передано міста Курськ та Білгород."},{"id":"e8","date":"12 вересня 2026","ic":"🤝","title":"Конфедерація Русі","text":"Укладено угоду про створення Конфедерації Русі.\nНа території Слобідської Землі утворено Автономну Слов’янську Республіку.\nНа території Запорізької Землі створено регіон особливого статусу «Священний Дніпро»."},{"id":"e9","date":"13 вересня 2026","ic":"✝","title":"Статути Української Соборної Церкви","text":"Собор Української Соборної Церкви (УСЦ) затвердив та оприлюднив статути Церкви, що визначили основні засади її діяльності та внутрішнього устрою."},{"id":"e10","date":"15 вересня 2026","ic":"🕊","title":"Угода з Гірським Союзом","text":"Після конфлікту між Українською Державою та Гірським Союзом укладено угоду про врегулювання відносин.\nВідповідно до угоди у складі Гірського Союзу утворено Кубанську Козацьку Автономію. Автономія перебуває під управлінням Гетьманського Посланця, який представляє інтереси Української Держави."},{"id":"e11","date":"23 вересня 2026","ic":"🚩","title":"Домініон Червоний Клин","text":"Утворено Домініон Української Держави — Червоний Клин."}]};

// --- Родовід: вільне розміщення карток і стрілок (логічне полотно 1000 завширшки)
const HC_W=1000,HC_CARD=190;let HCSEL='',HCMODE='',HCFROM='';
const HC_POS={t1:[150,10],t2:[150,320],t3:[420,320],t4:[690,320],t5:[150,640],t6:[470,640]};
const HC_SIDES=[['auto','авто'],['top','зверху'],['bottom','знизу'],['left','зліва'],['right','справа']];
function hcEnsurePos(tree){let maxY=0;tree.forEach(n=>{if(n.x!=null&&n.y!=null)maxY=Math.max(maxY,+n.y);});
  tree.forEach((n,i)=>{if(n.x==null||n.y==null){const d=HC_POS[n.id];if(d&&HIST_DEFAULT.tree.some(x=>x.id===n.id&&x.name===n.name)){n.x=d[0];n.y=d[1];}else{maxY+=300;n.x=40+(i%4)*240;n.y=maxY;}}});}
// стрілки: якщо ще не збережені — будуються з «походить від»
function hcArrows(sx){if(!Array.isArray(sx.arrows))sx.arrows=(sx.tree||[]).filter(n=>n.parent&&(sx.tree||[]).some(x=>x.id===n.parent)).map(n=>({id:'a'+n.id,from:n.parent,to:n.id,style:n.rel==='dom'?'dashed':'solid',label:n.via||(n.rel==='dom'?'домініон':'')}));return sx.arrows;}
function histCanvasHtml(s,si,edit){const tree=s.tree||[];hcEnsurePos(tree);const arrows=hcArrows(s);
  const card=n=>`<div class="htnode hcard${n.ended?' ended':''}${edit?' drag':''}${edit&&HCFROM===n.id?' from':''}" data-hn="${esc(n.id)}" style="left:${+n.x}px;top:${+n.y}px;width:${HC_CARD}px">${n.img?`<img src="${esc(n.img)}" alt="Прапор: ${esc(n.name)}" draggable="false">`:'<div class="htnoimg">🏳</div>'}<b>${esc(n.name)}</b>${n.date?`<span class="htdate">${n.ended?'✝ ':''}${esc(n.date)}</span>`:''}${n.note?`<small>${esc(n.note)}</small>`:''}</div>`;
  let tb='';
  if(edit){const a=arrows.find(x=>x.id===HCSEL);const sel=(k,v)=>`<select id="hca-${k}" data-a="hca" data-k="${k}" data-s="${si}">${HC_SIDES.map(([x,l])=>`<option value="${x}"${(v||'auto')===x?' selected':''}>${l}</option>`).join('')}</select>`;
    tb=`<div class="hctools"><button class="small${HCMODE==='add'?' primary':''}" data-a="hcadd" data-s="${si}">➕ Нова стрілка</button>${HCMODE==='add'?`<span class="hint warn">${HCFROM?'Тепер клікніть картку, <b>куди</b> веде стрілка.':'Клікніть картку, <b>з якої</b> йде стрілка.'}</span><button class="small ghost" data-a="hcadd" data-k="0" data-s="${si}">Скасувати</button>`:a?`<span class="hctsel"><b>Стрілка:</b> ${esc((tree.find(n=>n.id===a.from)||{}).name||'?')} → ${esc((tree.find(n=>n.id===a.to)||{}).name||'?')}</span>
      <input type="text" id="hca-label" data-a="hca" data-k="label" data-s="${si}" value="${esc(a.label||'')}" placeholder="Підпис, напр. перетворилося" style="max-width:220px">

function pickAvatar(cb){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const S=128,cv=document.createElement('canvas');cv.width=S;cv.height=S;const k=Math.max(S/im.width,S/im.height);const w=im.width*k,h=im.height*k;cv.getContext('2d').drawImage(im,(S-w)/2,(S-h)/2,w,h);cb(cv.toDataURL('image/jpeg',0.85));};im.src=r.result;};r.readAsDataURL(f);};inp.click();}

function nextWeek(lbl){
  const m=/(\d{2})\.(\d{2})\s*-\s*(\d{2})\.(\d{2})/.exec(lbl||'');
  let start;const y=new Date().getFullYear();
  if(m){start=new Date(y,+m[4]-1,+m[3]);start.setDate(start.getDate()+1);}else{start=new Date();}
  const end=new Date(start);end.setDate(end.getDate()+6);
  const f=d=>String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0');
  return f(start)+' - '+f(end);
}

  const inM=t=>{if(!t)return 0;const d=new Date(t);return d.getFullYear()===y&&d.getMonth()===m?d.getDate():0;};
  allBills().forEach(b=>{const ph=phase(b);let t=0,tx='';
    if(ph==='voting'){t=Date.parse(b.closesAt);tx=`Кінець голосування: «${b.title||''}»`;}

  PETS.filter(pt=>pt.status==='open'&&pt.at&&Date.now()<pt.at+PET_MS).forEach(pt=>{const t=pt.at+PET_MS;const d=inM(t);if(d)add(d,{cls:'dl',ic:'✍️',tx:`Кінець збору підписів: «${pt.title}»`,t:new Date(t).toISOString()});});
  if(emActive()){const t=+EMERG.cur.untilMs;const d=inM(t);if(d)add(d,{cls:'em',ic:'🚨',tx:'Закінчується надзвичайний стан',t:new Date(t).toISOString()});}

  return out;}

async function hashId(str){
  const buf = await crypto.subtle.digest("SHA-1", new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function walkImages(state, fn){
  if (state.__church) { const c = state.__church; if (c.emblem && c.emblem.img) fn(c.emblem); (c.eparchies || []).forEach(e => { if (e.img) fn(e); }); }
  state.sections.forEach(s => { (s.lands||[]).forEach(l => (l.flags||[]).forEach(f => fn(f))); (s.bills||[]).forEach(b => { if (b.amend && b.amend.img) fn(b.amend); }); if (s.kind === "players") (s.list||[]).forEach(p => { if (p.img) fn(p); }); if (s.kind === "gov" && s.emblem && s.emblem.img) fn(s.emblem); if (s.kind === "history") (s.tree || []).forEach(n => { if (n.img) fn(n); }); if (s.kind === "church") { if (s.emblem && s.emblem.img) fn(s.emblem); (s.eparchies || []).forEach(e => { if (e.img) fn(e); }); } });
}
async function storeImages(st){
  const flags = []; walkImages(st, f => flags.push(f));
  for (const f of flags) {
    if (!f.img || typeof f.img !== "string" || !f.img.startsWith("data:")) continue;
    const id = await hashId(f.img);
    if (!known.has(id)) { let ex = false; try { ex = (await getDoc(doc(db, "images", id))).exists(); } catch (_) {} if (!ex) await setDoc(doc(db, "images", id), { data: f.img }); known.add(id); IMGS[id] = f.img; }
    f.img = "img:" + id;
  }
}
// картинки адресуються хешем, тож не змінюються: кешуємо їх у браузері (IndexedDB) і більше не тягнемо з бази
const IDB = (() => { let p = null; const open = () => p || (p = new Promise((res, rej) => { try { const r = indexedDB.open("ud-img", 1); r.onupgradeneeded = () => r.result.createObjectStore("img"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }));
  const tx = (mode, fn) => open().then(db0 => new Promise((res, rej) => { const t = db0.transaction("img", mode); const st = t.objectStore("img"); const out = fn(st); t.oncomplete = () => res(out && typeof out === 'object' && 'result' in out ? out.result : undefined); t.onerror = () => rej(t.error); }));
  return { get: id => tx("readonly", st => st.get(id)).catch(() => undefined), set: (id, v) => tx("readwrite", st => st.put(v, id)).catch(() => {}) }; })();
async function resolveImages(st){
  if (BOTMODE) { walkImages(st, f => { if (f.img && f.img.startsWith("img:")) known.add(f.img.slice(4)); }); return st; }   // боту картинки не потрібні
  const refs = []; walkImages(st, f => { if (f.img && f.img.startsWith("img:")) refs.push(f); });
  const ids = [...new Set(refs.map(f => f.img.slice(4)))].filter(id => !(id in IMGS));
  await Promise.all(ids.map(async id => {
    let v = await IDB.get(id); if (typeof v !== 'string') v = '';
    if (!v) { try { const d = await getDoc(doc(db, "images", id)); v = d.exists() ? d.data().data : ""; if (v) IDB.set(id, v); } catch (_) { v = ""; } }
    IMGS[id] = v || ""; if (v) known.add(id);
  }));
  refs.forEach(f => { f.img = IMGS[f.img.slice(4)] || ""; });
  return st;
}

const isLandsSec = s => (!s.kind && s.lands) || s.kind === "units" || s.kind === "lost";

function buildState(){
  const st = JSON.parse(STATE_JSON);
  if (ECON_JSON) { const i = st.sections.findIndex(x => x.kind === "economy"); if (i >= 0) { try { st.sections[i] = JSON.parse(ECON_JSON); } catch (_) {} } }
  if (LANDS_JSON) { try { JSON.parse(LANDS_JSON).forEach(sec => { const i = st.sections.findIndex(x => x.id === sec.id); if (i >= 0) st.sections[i] = sec; else { const j = st.sections.findIndex(x => x.id === "ck"); st.sections.splice(j < 0 ? 1 : j + 1, 0, sec); } }); } catch (_) {} }
  if (PLAYERS_JSON) { try { const ps = JSON.parse(PLAYERS_JSON); const i = st.sections.findIndex(x => x.kind === "players"); if (i >= 0) st.sections[i] = ps; else st.sections.push(ps); } catch (_) {} }
  if (CHURCH_JSON) { try { st.__church = JSON.parse(CHURCH_JSON); } catch (_) {} }
  if (RANKS_JSON) { try { const rs = JSON.parse(RANKS_JSON); const i = st.sections.findIndex(x => x.kind === "ranks"); if (i >= 0) st.sections[i] = rs; else { const j = st.sections.findIndex(x => x.kind === "awards"); st.sections.splice(j < 0 ? st.sections.length : j + 1, 0, rs); } } catch (_) {} }
  return resolveImages(st);
}

  return { econ: em(p => p.perm === "econ"), lands: em(p => p.perm === "lands"), hetman: em(p => p.id === "hetman"), court: em(p => p.perm === "court"), arbiter: em(p => p.perm === "arbiter"), prosecutor: em(p => p.perm === "prosecutor"), genjudge: em(p => p.id === "judge"),

const BAL = { ids: [], subs: {}, data: {}, ready: new Set(), first: true };
function balEmit(){ const need = BAL.ids.length * 2; if (BAL.ready.size < need) return; const v = {}, o = {}; BAL.ids.forEach(id => { if (BAL.data["b|" + id] && BAL.data["b|" + id].length) v[id] = BAL.data["b|" + id]; if (BAL.data["o|" + id] && BAL.data["o|" + id].length) o[id] = BAL.data["o|" + id]; }); window.APP.ovotes(o); window.APP.votes(v); }
function syncBallots(ids){ ids = [...new Set(ids.filter(Boolean).map(String))]; const key = ids.slice().sort().join(","); if (!BAL.first && key === BAL.ids.slice().sort().join(",")) return; BAL.first = false;
  Object.keys(BAL.subs).forEach(k => { const id = k.slice(2); if (!ids.includes(id)) { try { BAL.subs[k](); } catch (_) {} delete BAL.subs[k]; delete BAL.data[k]; BAL.ready.delete(k); } });
  BAL.ids = ids;
  ids.forEach(id => [["b", "ballots"], ["o", "overrides"]].forEach(([p, col]) => { const k = p + "|" + id; if (BAL.subs[k]) return;
    BAL.subs[k] = onSnapshot(collection(db, col, id, "votes"), snap => { const out = []; snap.forEach(d => out.push({ land: d.id, ...d.data() })); BAL.data[k] = out; BAL.ready.add(k); balEmit(); }, e => { console.warn(e); BAL.data[k] = []; BAL.ready.add(k); balEmit(); }); }));
  balEmit(); }

// live updates: new bills, votes, decisions and edits appear without reloading the page
function watch(){
  onSnapshot(collection(db, "proposals"), snap => window.APP.props(listFrom(snap)), e => console.warn(e));
  syncBallots((window.APP_BALLOTIDS && window.APP_BALLOTIDS()) || []);

  onSnapshot(collection(db, "awardTypes"), snap => window.APP.awt(listFrom(snap)), e => console.warn(e));

  onSnapshot(collection(db, "petitions"), snap => window.APP.pets(listFrom(snap)), e => console.warn(e));

  onSnapshot(collection(db, "cases"), snap => window.APP.cases(listFrom(snap)), e => console.warn(e));
  onSnapshot(collection(db, "casenotes"), snap => window.APP.cnotes(listFrom(snap)), e => console.warn(e));
  onSnapshot(collection(db, "applications"), snap => window.APP.apps(listFrom(snap)), e => console.warn(e));
  onSnapshot(collection(db, "protocols"), snap => window.APP.prots(listFrom(snap)), e => console.warn(e));
  onSnapshot(collection(db, "advocates"), snap => window.APP.advs(listFrom(snap)), e => console.warn(e));
  onSnapshot(collection(db, "pardons"), snap => window.APP.pardons(listFrom(snap)), e => console.warn(e));
  if (!BOTMODE) onSnapshot(collection(db, "profiles"), snap => window.APP.profiles(listFrom(snap)), e => console.warn(e));
  if (!BOTMODE) onSnapshot(doc(db, "chatmod", "bans"), snap => window.APP.chatbans(snap.exists() ? (snap.data().bans || {}) : {}), e => console.warn(e));
  onSnapshot(doc(db, "site", "emergency"), snap => window.APP.emerg(snap.exists() ? snap.data() : null), e => console.warn(e));
  const part = (name, setter) => { let first = true; onSnapshot(doc(db, "site", name), async snap => {
    if (first) { first = false; return; }
    if (!snap.exists() || snap.metadata.hasPendingWrites || !STATE_JSON) return;
    setter(snap.data().json);
    try { window.APP.remote(await buildState()); } catch (e) { console.warn(e); }
  }, e => console.warn(e)); };
  part("state", j => { STATE_JSON = j; });
  part("econ", j => { ECON_JSON = j; });
  part("lands", j => { LANDS_JSON = j; });
  part("players", j => { PLAYERS_JSON = j; });
  part("ranks", j => { RANKS_JSON = j; });
  part("church", j => { CHURCH_JSON = j; });
}

  save, saveEcon, saveLands, savePlayers, syncAccess, loadVotes, loadProposals, vote, ovote, sign, propose, delProposal,
  postNews, delNews, giveAward, revokeAward, delAward,

  login: () => { const p = new GoogleAuthProvider(); if (p.setCustomParameters) p.setCustomParameters({ prompt: 'select_account' }); return signInWithPopup(auth, p); },
  logout: () => signOut(auth),
};
// the GitHub bot signs in with a one-time token and acts as an administrator
if (/[?&]bot=1/.test(location.search)) window.__botLogin = token => signInWithCustomToken(auth, token);
function start(){
  onAuthStateChanged(auth, async u => {
    const email = u ? (u.email||"").toLowerCase() : "";
    let bot = false;
    if (u) { try { bot = !!(await u.getIdTokenResult()).claims.bot; } catch (_) {} }
    window.APP.auth({ ready:true, email: bot ? "bot" : email, bot, admin: bot || (!!email && ADMINS.map(a=>a.toLowerCase()).includes(email)) });
  });
  loadAll()
    .then(s => { window.APP.load(s); watch(); })
    .catch(e => { console.error(e); window.APP.fail("Не вдалося завантажити дані: " + (e.code || e.message)); });
}
if (window.APP) start(); else window.APP_READY = start;
