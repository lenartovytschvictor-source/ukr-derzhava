<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Українська Держава</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;700&family=Lora:ital,wght@0,600;0,700;1,500&display=swap">
<style>*{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="page-style">
/* Layout: one column registry; each land is a row — current flag, name + offices, then the flag history strip */
:root{
  --bg:#150d07; --panel:#21160c; --panel2:#2b1d10; --line:#5a3f1f; --gold:#f0b030; --gold-soft:#c99a45;
  --cream:#f6ead0; --muted:#b89a70; --vacant:#e7c76a; --danger:#e0574a; --ok:#7cc66b;
  --f-display:"Lora","Georgia",serif; --f-body:"Golos Text","DejaVu Sans","Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg)}
body{color:var(--cream);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding-inline:20px;padding-block:28px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:2px solid var(--gold);padding-bottom:16px}
header.top h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4.4vw,44px);color:var(--gold);margin:0;text-wrap:balance}
header.top .meta{color:var(--muted);font-size:13px;margin-top:4px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:600 14px var(--f-body);color:var(--cream);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--gold-soft)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:var(--gold);color:#1b1006;border-color:var(--gold)}
button.ghost{background:transparent}
button.small{padding:4px 9px;font-size:12px;border-radius:6px}
button.danger{color:var(--danger);border-color:#6a2a22;background:transparent}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--danger)}
section.sec{margin-top:28px;scroll-margin-top:70px}
section.sec>h2{font-family:var(--f-display);font-size:28px;color:var(--gold);margin:0 0 4px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
section.sec>h2 small{font:500 14px var(--f-body);color:var(--muted)}
.lands{display:grid;gap:12px;margin-top:16px}
.land{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.flagbox{position:relative}
.flagbox img{width:150px;aspect-ratio:3/2;object-fit:cover;border-radius:6px;display:block;box-shadow:0 2px 0 rgba(0,0,0,.5)}
.info{min-width:0;display:grid;gap:10px;align-content:start}
.name{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.2}
.posts{display:flex;flex-wrap:wrap;gap:8px}
.post{display:flex;flex-direction:column;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:6px 12px;min-width:0}
.post .t{font-size:12px;color:var(--muted);letter-spacing:.02em}
.post .h{font-weight:700}
.post.vac{border-left-color:var(--vacant);border-style:dashed}
.post.vac .h{color:var(--vacant);font-weight:600}
.hist{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.hist .step{display:flex;align-items:center;gap:6px}
.hist img{width:54px;aspect-ratio:3/2;object-fit:cover;border-radius:3px;opacity:.85}
.hist .arrow{color:var(--gold-soft)}
.hist .cur{color:var(--cream)}
/* edit mode */
.edit .name-input{font:700 20px var(--f-display)}
input[type=text]{font:15px var(--f-body);color:var(--cream);background:#120b05;border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
.erow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center}
.fver{display:grid;grid-template-columns:60px minmax(0,1fr) 110px auto;gap:6px;align-items:center}
.fver img{width:60px;aspect-ratio:3/2;object-fit:cover;border-radius:3px}
.elabel{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.landtools{display:flex;gap:6px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:12px}
nav.toc{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;flex-wrap:wrap;padding-block:10px;border-bottom:1px solid var(--line)}
nav.toc button{font-size:14px;padding:7px 14px;border-radius:999px;background:var(--panel)}
nav.toc button[aria-current="page"]{background:var(--gold);color:#1b1006;border-color:var(--gold)}
.econ{display:grid;gap:22px;margin-top:16px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table.bud{border-collapse:collapse;width:100%;min-width:640px;font-variant-numeric:tabular-nums}
table.bud th,table.bud td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.bud thead th{background:var(--panel2);font-weight:700}
table.bud thead th .need{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
table.bud th.wk{white-space:nowrap;color:var(--gold);font-family:var(--f-display);font-size:16px}
table.bud tbody tr:last-child td,table.bud tbody tr:last-child th{border-bottom:0}
table.bud tfoot td,table.bud tfoot th{background:var(--panel2);font-size:13px;color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;border-radius:999px;padding:3px 11px;border:1px solid transparent}
.st.y{background:rgba(124,198,107,.16);color:var(--ok);border-color:rgba(124,198,107,.4)}
.st.n{background:rgba(224,87,74,.14);color:var(--danger);border-color:rgba(224,87,74,.4)}
button.st{cursor:pointer;font:700 13px var(--f-body)}
.vacname{color:var(--vacant)}
.patrons{display:grid;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.patrons h3{margin:0;font-family:var(--f-display);color:var(--gold);font-size:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.patrons h3 small{font:500 14px var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}
.prow{display:grid;grid-template-columns:minmax(80px,160px) minmax(0,1fr) 150px;gap:12px;align-items:center;font-variant-numeric:tabular-nums}
.prow .bar{height:14px;background:var(--panel2);border-radius:999px;overflow:hidden;display:block}
.prow .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-soft),var(--gold));border-radius:999px}
.prow .v{text-align:right;white-space:nowrap}
.prow .v small{color:var(--muted);margin-left:6px}
.erow.pt{grid-template-columns:minmax(0,1fr) 160px auto}
.erow.mem{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto}
.leaders{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.leaders .post{border-left-color:var(--gold);background:linear-gradient(var(--panel2),var(--panel));padding:8px 16px}
.leaders .post .h{font-family:var(--f-display);font-size:19px}
.land.unit{grid-template-columns:110px minmax(0,1fr)}
.land.unit .flagbox img{width:110px;aspect-ratio:auto;max-height:140px;object-fit:contain;box-shadow:none;border-radius:0;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.hist.unit img{aspect-ratio:auto;width:auto;height:44px}
.members{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.members .lbl{color:var(--muted);font-size:12px;margin-right:2px}
.members .m{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.cons{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;margin-top:18px;align-items:start}
.cons aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:grid;gap:4px;font-size:14px}
.cons aside button{text-align:left;background:transparent;border:0;border-left:2px solid var(--line);border-radius:0;padding:5px 10px;font-weight:500;color:var(--muted)}
.cons aside button:hover{color:var(--gold);border-left-color:var(--gold)}
.cons article.doc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:clamp(18px,4vw,40px);max-width:820px}
.doc .pre{font-family:var(--f-display);font-style:italic;font-size:18px;line-height:1.6;border-left:3px solid var(--gold);padding-left:16px;margin:0 0 8px}
.doc h3{font-family:var(--f-display);color:var(--gold);font-size:24px;margin:34px 0 4px;scroll-margin-top:80px;text-wrap:balance}
.doc h4{font-size:17px;margin:20px 0 6px;color:var(--cream)}
.doc p.cl{margin:4px 0;line-height:1.6;max-width:70ch}
.doc p.cl b{color:var(--gold-soft);font-variant-numeric:tabular-nums}
textarea{font:14px/1.5 var(--f-body);color:var(--cream);background:#120b05;border:1px solid var(--line);border-radius:6px;padding:8px;width:100%;min-height:90px;resize:vertical}
.artedit{display:grid;gap:6px;padding:10px;border:1px dashed var(--line);border-radius:8px;margin-top:10px}
@media (max-width:760px){.cons{grid-template-columns:1fr}.cons aside{position:static;display:flex;flex-wrap:wrap}}
.ecotop{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:4px;align-content:start}
.kpi .k{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.kpi .v{font-family:var(--f-display);font-size:28px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi a{color:var(--gold);font-weight:600}
.block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.block h3{margin:0;font-family:var(--f-display);color:var(--gold);font-size:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.block h3 small{font:500 14px var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}
table.exp{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
table.exp th,table.exp td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
table.exp th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
table.exp td.num{text-align:right;white-space:nowrap;font-weight:700}
table.exp th.num{text-align:right}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.erow.ex{grid-template-columns:100px minmax(0,1.6fr) 110px 90px minmax(0,1fr) auto}
.donut{display:grid;grid-template-columns:minmax(200px,260px) minmax(0,1fr);gap:24px;align-items:center}
.donut svg{width:100%;max-width:260px;height:auto;display:block}
.donut svg path{transition:opacity .15s}
.donut svg:hover path{opacity:.45}
.donut svg path:hover{opacity:1}
.donut .ctr1{font:700 22px var(--f-display);fill:var(--cream)}
.donut .ctr2{font:500 12px var(--f-body);fill:var(--muted)}
.legend{display:grid;gap:8px;font-variant-numeric:tabular-nums}
.legend .li{display:grid;grid-template-columns:14px minmax(0,1fr) auto auto;gap:10px;align-items:center}
.legend .sw{width:14px;height:14px;border-radius:4px}
.legend .nm{font-weight:600}
.legend .am{text-align:right}
.legend .pc{color:var(--muted);font-size:13px;min-width:48px;text-align:right}
@media (max-width:620px){.donut{grid-template-columns:1fr}.donut svg{margin:0 auto}.erow.ex{grid-template-columns:1fr 1fr}.erow.ex button{justify-self:start}}
.prices{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.prices .pc{display:flex;justify-content:space-between;gap:10px;align-items:baseline;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-variant-numeric:tabular-nums}
.prices .pn{font-weight:600}
.prices .pp{color:var(--ok);font-weight:700}
select{font:15px var(--f-body);color:var(--cream);background:#120b05;border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
.erow.don{grid-template-columns:90px minmax(0,1fr) minmax(0,1fr) 100px 150px auto}
.erow.don2{grid-template-columns:minmax(0,1fr) 120px 160px auto}
.artedit .dv,.erow.don2 .dv{color:var(--gold-soft);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.erow.don .dv{color:var(--gold-soft);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:620px){.erow.don{grid-template-columns:1fr 1fr}}
.parl{display:grid;gap:18px;margin-top:16px}
.pcounts{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;border-radius:999px;padding:3px 11px;border:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.pill.review{color:var(--vacant);border-color:rgba(231,199,106,.45)}
.pill.passed{color:var(--ok);border-color:rgba(124,198,107,.45)}
.pill.rejected{color:var(--danger);border-color:rgba(224,87,74,.45)}
.pill.veto{color:#c7a3e8;border-color:rgba(199,163,232,.45)}
.bill{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.bill .bh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:baseline}
.bill .bt{font-family:var(--f-display);font-size:20px;font-weight:700}
.bill .bm{color:var(--muted);font-size:13px}
.vbar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--panel2);gap:2px}
.vbar i{display:block;height:100%}
.vbar .f{background:#3f9a4b}.vbar .a{background:#c4473b}.vbar .z{background:#8a7a63}
.vleg{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.vleg b{color:var(--cream)}
.bill details summary{cursor:pointer;color:var(--gold-soft);font-weight:600;font-size:14px}
.bill details p{margin:6px 0 0;white-space:pre-wrap;line-height:1.55;max-width:75ch}
.reps{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.rep{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;display:grid;align-content:start}
.rep .t{font-size:12px;color:var(--muted)}
.rep .h{font-weight:700}
.rep.vac .h{color:var(--vacant);font-weight:600}
.erow.bill3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fver.unit img{aspect-ratio:auto;object-fit:contain;height:50px}
@media (max-width:620px){
  .land{grid-template-columns:1fr}
  .flagbox img{width:100%;max-width:260px}
  .erow{grid-template-columns:1fr 1fr}
  .erow button{grid-column:span 2;justify-self:start}
  .fver{grid-template-columns:60px 1fr;}
}
@media (prefers-reduced-motion:no-preference){.land{transition:border-color .15s}.land:hover{border-color:var(--gold-soft)}}
</style>
</head><body>
<div class="wrap" id="app"><p class="status">Завантаження…</p></div>
<script>
(function(){
const SKEL_HEAD='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*{box-sizing:border-box}:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;background:#fafaf8}img{max-width:100%}[hidden]{display:none!important}</style></head><body>';
const app=document.getElementById('app');
let state={updated:'',sections:[]};
let saved=JSON.stringify(state);
let AUTH={ready:false,email:'',admin:false};
let editing=false, art=null, readOnly=false, msg='', msgErr=false, busy=false;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cur=l=>l.flags[l.flags.length-1]||{img:'',name:'Нова земля',date:''};
const uid=()=>'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function viewLand(l,kind){
  const c=cur(l);const U=kind==='units';
  const posts=l.posts.map(p=>{const v=!String(p.holder||'').trim()||p.holder==='0';
    return `<div class="post${v?' vac':''}"><span class="t">${esc(p.title)}</span><span class="h">${v?'Вакантно':esc(p.holder)}</span></div>`}).join('');
  let hist='';
  if(l.flags.length>1){
    hist='<div class="hist'+(U?' unit':'')+'">'+l.flags.map((f,i)=>{
      const last=i===l.flags.length-1;
      return (i?`<span class="arrow">→</span>`:'')+`<span class="step${last?' cur':''}"><img src="${f.img}" alt="">${f.date?esc(f.date)+' · ':''}${esc(f.name)}</span>`}).join('')+'</div>';
  }
  return `<article class="land${U?' unit':''}"><div class="flagbox"><img src="${c.img}" alt="${U?'Емблема':'Прапор'}: ${esc(c.name)}"></div>
  <div class="info"><div class="name">${esc(c.name)}</div><div class="posts">${posts}</div>${U&&l.members&&l.members.length?'<div class="members"><span class="lbl">Вояки ('+l.members.length+'):</span>'+l.members.map(m=>`<span class="m">${esc(m)}</span>`).join('')+'</div>':''}${hist}</div></article>`;
}
function editLand(l,si,li,n,kind){
  const c=cur(l);const U=kind==='units';
  const posts=l.posts.map((p,pi)=>`<div class="erow"><input type="text" id="pt-${l.id}-${pi}" data-a="pt" data-s="${si}" data-l="${li}" data-p="${pi}" value="${esc(p.title)}" placeholder="Посада"><input type="text" id="ph-${l.id}-${pi}" data-a="ph" data-s="${si}" data-l="${li}" data-p="${pi}" value="${esc(p.holder==='0'?'':p.holder)}" placeholder="Вакантно"><button class="small danger" data-a="pdel" data-s="${si}" data-l="${li}" data-p="${pi}">Прибрати</button></div>`).join('');
  const flags=l.flags.map((f,fi)=>`<div class="fver${U?' unit':''}"><img src="${f.img}" alt=""><input type="text" id="fn-${l.id}-${fi}" data-a="fn" data-s="${si}" data-l="${li}" data-f="${fi}" value="${esc(f.name)}" placeholder="${U?'Назва куреня':'Назва землі'}"><input type="text" id="fd-${l.id}-${fi}" data-a="fd" data-s="${si}" data-l="${li}" data-f="${fi}" value="${esc(f.date)}" placeholder="Дата"><button class="small danger" data-a="fdel" data-s="${si}" data-l="${li}" data-f="${fi}" ${l.flags.length<2?'disabled':''}>Прибрати</button></div>`).join('');
  return `<article class="land edit${U?' unit':''}"><div class="flagbox"><img src="${c.img}" alt=""></div>
  <div class="info">
    <div class="landtools"><button class="small" data-a="up" data-s="${si}" data-l="${li}" ${li===0?'disabled':''}>↑</button><button class="small" data-a="down" data-s="${si}" data-l="${li}" ${li===n-1?'disabled':''}>↓</button><button class="small danger" data-a="ldel" data-s="${si}" data-l="${li}">${U?'Видалити курінь':'Видалити землю'}</button></div>
    <div class="elabel">${U?'Емблеми (остання — чинна)':'Прапори (останній — чинний)'}</div>${flags}
    <div><button class="small" data-a="fadd" data-s="${si}" data-l="${li}">${U?'+ Нова емблема':'+ Новий прапор'}</button> <span class="hint">${U?'нова назва чи нова емблема':'нова назва чи новий прапор землі'}</span></div>
    <div class="elabel">Посади</div>${posts}
    <div><button class="small" data-a="padd" data-s="${si}" data-l="${li}">+ Посада</button></div>
    ${U?`<div class="elabel">Вояки (через кому)</div><input type="text" id="mb-${l.id}" data-a="mb" data-s="${si}" data-l="${li}" value="${esc((l.members||[]).join(', '))}" placeholder="Ім'я, Ім'я, …">`:''}
  </div></article>`;
}
const fmt=n=>Number(n||0).toLocaleString('uk-UA');
let active=null;
try{const h=(location.hash||'').slice(1);if(h)active=h;}catch(e){}
const SERIES=['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300','#9085e9','#e66767'];
function donutHtml(list,tot){
  // colour follows the patron (stored order), never the rank; 9+ patrons fold into "Інші"
  let items=list.map((p,i)=>({name:p.name||'Без імені',v:+p.amount||0,c:SERIES[i]||null}));
  if(items.length>8){const rest=items.slice(7);items=items.slice(0,7).concat([{name:'Інші',v:rest.reduce((a,x)=>a+x.v,0),c:'#8a7a63'}]);}

function pickImage(cb,png){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{const im=new Image();im.onload=()=>{let w=360,h=Math.round(im.height*w/im.width);if(png&&h>300){h=300;w=Math.round(im.width*h/im.height);}const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);cb(png?cv.toDataURL('image/png'):cv.toDataURL('image/jpeg',0.86));};im.src=r.result;};
    r.readAsDataURL(f);};
  inp.click();
}
function nextWeek(lbl){
  const m=/(\d{2})\.(\d{2})\s*-\s*(\d{2})\.(\d{2})/.exec(lbl||'');

  if(m){start=new Date(y,+m[4]-1,+m[3]);start.setDate(start.getDate()+1);}else{start=new Date();}

  const f=d=>String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0');
  return f(start)+' - '+f(end);
}

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);
const known = new Set();          // image ids already stored in Firestore

// images live in their own documents (a Firestore document is limited to 1 MB)
async function hashId(str){
  const buf = await crypto.subtle.digest("SHA-1", new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function walkImages(state, fn){
  state.sections.forEach(s => (s.lands||[]).forEach(l => (l.flags||[]).forEach(f => fn(f))));
}
async function loadAll(){
  const snap = await getDoc(doc(db, "site", "state"));
  if (!snap.exists()) {
    // first run: start from seed.json bundled with the site
    const seed = await (await fetch("seed.json", {cache:"no-store"})).json();
    return seed;
  }
  const state = JSON.parse(snap.data().json);
  const imgs = {};
  (await getDocs(collection(db, "images"))).forEach(d => { imgs[d.id] = d.data().data; known.add(d.id); });
  walkImages(state, f => { if (f.img && f.img.startsWith("img:")) f.img = imgs[f.img.slice(4)] || ""; });
  return state;
}
async function save(state){
  const copy = JSON.parse(JSON.stringify(state));
  const flags = []; walkImages(copy, f => flags.push(f));
  for (const f of flags) {
    if (!f.img || !f.img.startsWith("data:")) continue;
    const id = await hashId(f.img);
    if (!known.has(id)) { await setDoc(doc(db, "images", id), { data: f.img }); known.add(id); }
    f.img = "img:" + id;
  }
  await setDoc(doc(db, "site", "state"), { json: JSON.stringify(copy), updatedBy: auth.currentUser.email, updatedAt: new Date().toISOString() });
}
window.FB = {
  save,
  login: () => signInWithPopup(auth, new GoogleAuthProvider()),
  logout: () => signOut(auth),
};
function start(){
  onAuthStateChanged(auth, u => {
    const email = u ? (u.email||"").toLowerCase() : "";
    window.APP.auth({ ready:true, email, admin: !!email && ADMINS.map(a=>a.toLowerCase()).includes(email) });
  });
  loadAll().then(s => window.APP.load(s)).catch(e => { console.error(e); window.APP.fail("Не вдалося завантажити дані: " + (e.code || e.message)); });
}
if (window.APP) start(); else window.APP_READY = start;
